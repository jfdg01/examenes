<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LN: el test</title>
<style>
  :root { --bg:#14161a; --card:#1e2127; --line:#2c3038; --txt:#e8e8ea; --dim:#9aa0aa; --ok:#2e9e5b; --ko:#c94141; --warn:#d9a21b; --acc:#4c7bd9; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:16px/1.45 system-ui, sans-serif; }
  body.con-hoja { padding-bottom:80vh; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 4px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:var(--acc); }
  .dim { color:var(--dim); font-size:13px; }
  .meta { color:var(--dim); font-size:13px; margin-bottom:10px; }
  .tarjeta { background:var(--card); border-radius:12px; padding:14px; margin:12px 0; }
  .q { font-size:19px; font-weight:600; margin:6px 0 18px; }
  .grande { display:block; width:100%; padding:16px; margin:12px 0; border-radius:12px; border:0; background:var(--acc); font-weight:600; font-size:17px; }
  .grande.otro { background:var(--card); border:2px solid var(--line); }
  .fila { display:flex; margin-bottom:10px; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .fila .texto { flex:1; text-align:left; background:none; border:0; padding:14px; }
  .fila .dudo { width:64px; background:#2a2620; border:0; border-left:2px solid var(--line); color:var(--warn); font-size:13px; font-weight:700; }
  .fila.ok { border-color:var(--ok); background:#1d3326; }
  .fila.ko { border-color:var(--ko); background:#3a1f1f; }
  .fila button:disabled { cursor:default; }
  .blanco { width:100%; padding:12px; border-radius:12px; border:2px dashed var(--line); background:none; color:var(--dim); }
  .hoja { position:fixed; left:0; right:0; bottom:0; background:var(--card); border-radius:18px 18px 0 0; padding:18px 16px 24px; max-height:75vh; overflow:auto; box-shadow:0 -8px 30px #0008; animation:subir .25s ease-out; }
  .hoja > div { max-width:560px; margin:0 auto; }
  .hoja img { width:100%; border-radius:8px; margin-top:6px; background:#fff; }
  .hoja .fuente { color:var(--dim); font-size:13px; margin:8px 0; }
  @keyframes subir { from { transform:translateY(100%); } }
  .aviso-respuesta { font-size:14px; font-weight:600; padding:6px 10px; border-left:3px solid; border-radius:4px; margin:4px 0 0; }
  .alarma { color:#f08a8a; background:#3a1f1f; }
  .suerte { color:var(--warn); background:#2a2620; }
  .aviso { color:var(--warn); }
  .tirador, #editar { display:none; }
  @media (max-width:899px) { .hoja.vacia { display:none; } }
  /* En una pantalla ancha, la pregunta va a la izquierda y la solución a la derecha. --L, --S y --R son el borde izquierdo, el separador y el borde derecho. */
  @media (min-width:900px) {
    body.con-hoja { padding-bottom:0; }
    main:has(.dos) { max-width:none; margin:0; padding:16px 0; }
    .dos { display:grid; grid-template-columns:calc(var(--S) - var(--L) - 48px) 1fr; gap:48px; align-items:start; margin-left:var(--L); width:calc(var(--R) - var(--L)); padding:0 24px; }
    .dos .meta { display:flex; justify-content:space-between; align-items:center; gap:12px; }
    .dos .hoja { position:sticky; top:16px; max-height:calc(100vh - 32px); padding:0; background:none; border-radius:0; box-shadow:none; animation:none; }
    .dos .hoja > div { max-width:none; }
    .hoja.vacia { color:var(--dim); }
    body:has(.dos) #editar { display:block; padding:2px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:12px; }
    body.editando #editar { background:var(--acc); border-color:var(--acc); color:var(--txt); }
    body:has(.dos) .tirador { display:block; position:fixed; top:0; bottom:0; width:24px; margin-left:-12px; cursor:col-resize; touch-action:none; z-index:9; }
    .tirador::after { content:""; position:absolute; top:16px; bottom:16px; left:11px; width:2px; background:var(--line); }
    .tirador::before { content:""; position:absolute; top:50%; left:5px; width:14px; height:40px; margin-top:-20px; border-radius:7px; border:2px solid var(--line); z-index:1;
      background:radial-gradient(circle, var(--dim) 1.5px, transparent 2px) center / 6px 8px repeat-y, var(--card); }
    .tirador:hover::after, .tirador.activo::after { background:var(--acc); }
    .tirador:hover::before, .tirador.activo::before { border-color:var(--acc); }
    body:not(.editando) .tirador { pointer-events:none; }
    body:not(.editando) .tirador::before, body:not(.editando) #tirador-L::after, body:not(.editando) #tirador-R::after { display:none; }
  }
</style>
</head>
<body>
<main id="app"><p class="dim">Cargando el banco…</p></main>
<div class="tirador" id="tirador-L"></div><div class="tirador" id="tirador-S"></div><div class="tirador" id="tirador-R"></div>
<button id="editar">Ajustar las columnas</button>
<script type="module" src="app.js"></script>
</body>
</html>
