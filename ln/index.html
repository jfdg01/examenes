<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LN: el test</title>
<style>
  @font-face { font-family:"JetBrains Mono"; src:url(fuentes/JetBrainsMono-Regular.ttf); font-weight:400; }
  @font-face { font-family:"JetBrains Mono"; src:url(fuentes/JetBrainsMono-Bold.ttf); font-weight:600 800; }
  /* Gruvbox dark, la paleta de la terminal. */
  :root { --bg:#282828; --card:#3c3836; --line:#504945; --txt:#ebdbb2; --dim:#a89984; --ok:#b8bb26; --ko:#fb4934; --warn:#fabd2f; --acc:#83a598; --sobre-acc:#282828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 "JetBrains Mono", monospace; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 4px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:var(--acc); }
  .dim { color:var(--dim); font-size:13px; }
  .meta { color:var(--dim); font-size:13px; margin-bottom:10px; }
  * { scrollbar-width:none; }
  *::-webkit-scrollbar { display:none; }
  .tarjeta { background:var(--card); border-radius:12px; padding:14px; margin:12px 0; }
  .q { font-size:19px; font-weight:600; margin:6px 0 18px; }
  .grande { display:block; width:100%; padding:16px; margin:12px 0; border-radius:12px; border:0; background:var(--acc); color:var(--sobre-acc); font-weight:600; font-size:16px; }
  .grande.otro { color:var(--txt); background:var(--card); border:2px solid var(--line); }
  .fila { display:flex; margin-bottom:10px; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .fila .texto { flex:1; text-align:left; background:none; border:0; padding:14px; }
  .fila .dudo { width:64px; background:color-mix(in srgb, var(--warn) 15%, var(--bg)); border:0; border-left:2px solid var(--line); color:var(--warn); font-size:13px; font-weight:700; }
  .fila.ok { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 18%, var(--bg)); }
  .fila.ko { border-color:var(--ko); background:color-mix(in srgb, var(--ko) 18%, var(--bg)); }
  .fila .icono { display:flex; align-items:center; padding:0 14px; }
  .fila.ok .icono { color:var(--ok); }
  .fila.ko .icono { color:var(--ko); }
  .fila button:disabled { cursor:default; }
  .blanco { width:100%; padding:12px; border-radius:12px; border:2px dashed var(--line); background:none; color:var(--dim); }
  .hoja img { width:100%; border-radius:8px; margin-top:6px; background:#fff; }
  .hoja .fuentes { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0; }
  .hoja .fuente { padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--txt); font-size:14px; text-align:left; }
  .hoja .fuente.abierto { border-color:var(--acc); }
  .hoja .panel { color:var(--dim); font-size:13px; }
  .hoja .panel > * { margin:8px 0; }
  .aviso-respuesta { font-size:14px; font-weight:600; padding:6px 10px; border-left:3px solid; border-radius:4px; margin:4px 0 0; }
  .alarma { color:var(--ko); background:color-mix(in srgb, var(--ko) 18%, var(--bg)); }
  .suerte { color:var(--warn); background:color-mix(in srgb, var(--warn) 15%, var(--bg)); }
  .aviso { color:var(--warn); }
  .tirador, #editar { display:none; }
  /* La pregunta y la solución van en 2 zonas: 2 columnas en una pantalla ancha, y 2 filas en una pantalla estrecha. --L, --S y --R son el borde del inicio, el separador y el borde del fin, en px. */
  main:has(.dos) { max-width:none; margin:0; padding:0; }
  .dos .meta { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .hoja.vacia { color:var(--dim); }
  body:has(.dos) #editar { display:block; padding:2px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:12px; }
  .acciones { display:flex; gap:6px; }
  .copiar { font-size:12px; display:flex; align-items:center; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--dim); }
  .copiar.on { color:var(--acc); border-color:var(--acc); }
  .notas { display:block; width:100%; box-sizing:border-box; margin-top:16px; padding:12px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--txt); font:inherit; font-size:14px; resize:vertical; }
  .notas[hidden] { display:none; }
  .copiar.hecho { color:var(--ok); border-color:var(--ok); }
  body.editando #editar { background:var(--acc); border-color:var(--acc); color:var(--sobre-acc); }
  body:has(.dos) .tirador { display:block; position:fixed; touch-action:none; z-index:9; }
  .tirador.h { display:none !important; }
  .tirador::after { content:""; position:absolute; background:var(--line); }
  .tirador::before { content:""; position:absolute; border-radius:7px; border:2px solid var(--line); z-index:1; }
  .tirador:hover::after, .tirador.activo::after { background:var(--acc); }
  .tirador:hover::before, .tirador.activo::before { border-color:var(--acc); }
  body:not(.editando) .tirador { pointer-events:none; }
  body:not(.editando) .tirador::before, body:not(.editando) #tirador-L::after, body:not(.editando) #tirador-R::after, body:not(.editando) .h::after { display:none; }
  @media (min-width:900px) {
    main:has(.dos) { padding:16px 0; }
    .dos { display:grid; grid-template-columns:calc(var(--S) - var(--L) - 48px) 1fr; gap:48px; align-items:start; margin-left:var(--L); width:calc(var(--R) - var(--L)); padding:0 24px; }
    .dos .hoja { position:sticky; top:16px; max-height:calc(100vh - 32px); overflow:auto; }
    .tirador { top:0; bottom:0; width:24px; margin-left:-12px; cursor:col-resize; }
    .tirador::after { top:16px; bottom:16px; left:11px; width:2px; }
    .tirador::before { top:50%; left:5px; width:14px; height:40px; margin-top:-20px;
      background:radial-gradient(circle, var(--dim) 1.5px, transparent 2px) center / 6px 8px repeat-y, var(--card); }
  }
  @media (max-width:899px) {
    .dos { position:fixed; left:var(--I); width:calc(var(--F) - var(--I)); top:var(--L); height:calc(var(--R) - var(--L)); display:grid; grid-template-rows:calc(var(--S) - var(--L) - 24px) 1fr; gap:24px; padding:12px 16px; }
    .dos > div { overflow:auto; min-height:0; }
    .tirador { left:0; right:0; height:24px; margin-top:-12px; cursor:row-resize; }
    .tirador::after { left:16px; right:16px; top:11px; height:2px; }
    .tirador::before { left:50%; top:5px; width:40px; height:14px; margin-left:-20px;
      background:radial-gradient(circle, var(--dim) 1.5px, transparent 2px) center / 8px 6px repeat-x, var(--card); }
    body:has(.dos) .tirador.h { display:block !important; left:auto; right:auto; top:var(--L); bottom:auto; width:24px; height:calc(var(--R) - var(--L)); margin:0 0 0 -12px; cursor:col-resize; }
    .tirador.h::after { top:0; bottom:0; left:11px; right:auto; width:2px; height:auto; }
    .tirador.h::before { top:50%; left:5px; width:14px; height:40px; margin:-20px 0 0 0;
      background:radial-gradient(circle, var(--dim) 1.5px, transparent 2px) center / 6px 8px repeat-y, var(--card); }
  }
</style>
</head>
<body>
<main id="app"><p class="dim">Cargando el banco…</p></main>
<div class="tirador" id="tirador-L"></div><div class="tirador" id="tirador-S"></div><div class="tirador" id="tirador-R"></div><div class="tirador h" id="tirador-I"></div><div class="tirador h" id="tirador-F"></div>
<button id="editar">Ajustar</button>
<script type="module" src="app.js"></script>
</body>
</html>
