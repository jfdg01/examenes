[package]
name = "servidor"
version = "0.1.0"
edition = "2024"

[dependencies]
nucleo = { path = "../nucleo" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "sync"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1.26"
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde"] }

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
