[package]
name = "servidor"
version = "0.1.0"
edition = "2024"

[dependencies]
nucleo = { path = "../nucleo" }
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
tower-http = { version = "0.7", features = ["fs"] }
serde_json = "1"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"
serde_json = "1"
