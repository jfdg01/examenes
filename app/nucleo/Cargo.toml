[package]
name = "nucleo"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fsrs = { version = "7", default-features = false }
jiff = { version = "1.0.2", default-features = false, features = ["std", "serde"] }
serde = { version = "1", features = ["derive"] }
tsify = { version = "0.5", features = ["js"] }
# La versión es la de `wasm-bindgen-cli`.
wasm-bindgen = "=0.2.130"

# `fsrs` trae `getrandom`, que en wasm32 pide su backend de JS. El `cfg` va en `.cargo/config.toml`.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"
