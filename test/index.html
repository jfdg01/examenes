<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LN: el test</title>
<style>
  @font-face { font-family:"JetBrains Mono"; src:url(fuentes/JetBrainsMono-Regular.ttf); font-weight:400; }
  @font-face { font-family:"JetBrains Mono"; src:url(fuentes/JetBrainsMono-Bold.ttf); font-weight:600 800; }
  /* Gruvbox dark, la paleta de la terminal. */
  :root { --bg:#282828; --card:#3c3836; --line:#504945; --txt:#ebdbb2; --dim:#a89984; --ok:#b8bb26; --ko:#fb4934; --warn:#fabd2f; --acc:#83a598; --sobre-acc:#282828; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:15px/1.5 "JetBrains Mono", monospace; }
  main { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:24px; margin:8px 0 4px; }
  button { font:inherit; color:inherit; cursor:pointer; }
  a { color:var(--acc); }
  .dim { color:var(--dim); font-size:13px; }
  .meta { color:var(--dim); font-size:13px; margin-bottom:10px; }
  * { scrollbar-width:none; }
  *::-webkit-scrollbar { display:none; }
  .tarjeta { background:var(--card); border-radius:12px; padding:14px; margin:12px 0; }
  .q { font-size:19px; font-weight:600; margin:6px 0 18px; }
  .grande { display:block; width:100%; padding:16px; margin:12px 0; border-radius:12px; border:0; background:var(--acc); color:var(--sobre-acc); font-weight:600; font-size:16px; }
  .grande.otro { color:var(--txt); background:var(--card); border:2px solid var(--line); }
  .fila { display:flex; margin-bottom:10px; border:2px solid var(--line); border-radius:12px; overflow:hidden; background:var(--card); }
  .fila .texto { flex:1; text-align:left; background:none; border:0; padding:14px; }
  .fila .dudo { width:64px; background:color-mix(in srgb, var(--warn) 15%, var(--bg)); border:0; border-left:2px solid var(--line); color:var(--warn); font-size:13px; font-weight:700; }
  .fila.ok { border-color:var(--ok); background:color-mix(in srgb, var(--ok) 18%, var(--bg)); }
  .fila.ko { border-color:var(--ko); background:color-mix(in srgb, var(--ko) 18%, var(--bg)); }
  .fila .icono { display:flex; align-items:center; padding:0 14px; }
  .fila.ok .icono { color:var(--ok); }
  .fila.ko .icono { color:var(--ko); }
  .fila button:disabled { cursor:default; }
  .blanco { width:100%; padding:12px; border-radius:12px; border:2px dashed var(--line); background:none; color:var(--dim); }
  .hoja .fuente p { margin:12px 0 6px; color:var(--dim); font-size:13px; }
  .hoja .fuente iframe { display:block; width:100%; height:calc(100vh - 140px); border:0; border-radius:8px; background:#fff; }
  .aviso-respuesta { font-size:14px; font-weight:600; padding:6px 10px; border-left:3px solid; border-radius:4px; margin:4px 0 0; }
  .alarma { color:var(--ko); background:color-mix(in srgb, var(--ko) 18%, var(--bg)); }
  .suerte { color:var(--warn); background:color-mix(in srgb, var(--warn) 15%, var(--bg)); }
  .aviso { color:var(--warn); }
  .tramos { display:flex; gap:2px; height:14px; border-radius:7px; overflow:hidden; margin-top:14px; }
  .conceptos p { margin:6px 0 0; }
  .nota .cabecera { display:flex; align-items:center; gap:12px; }
  .nota .cabecera b { font-size:16px; white-space:nowrap; }
  .nota input { flex:1; min-width:0; accent-color:var(--acc); }
  .nota .flecha { display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; text-align:center; margin-top:14px; }
  .nota .flecha b { display:block; font-size:26px; line-height:1.1; color:var(--acc); }
  .nota .flecha span { font-size:12px; color:var(--dim); }
  .nota .flecha .medio span { color:var(--warn); font-weight:700; font-size:14px; }
  .nota .flecha .medio i { display:block; height:2px; margin-top:4px; background:var(--warn); position:relative; }
  .nota .flecha .medio i::after { content:""; position:absolute; right:-2px; top:-5px; border:6px solid transparent; border-left-color:var(--warn); border-right:0; }
  .nota .camino { position:relative; height:20px; border-radius:6px; background:var(--line); overflow:hidden; margin-top:14px; }
  .nota .camino i { position:absolute; top:0; bottom:0; }
  .nota .camino .hecho { left:0; background:var(--ok); }
  .nota .camino .falta { background:var(--warn); }
  .nota .camino .marca { width:2px; margin-left:-1px; background:var(--txt); }
  .nota .consejo { display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:14px; padding:8px 10px; border-radius:8px; cursor:pointer; list-style:none; background:color-mix(in srgb, var(--acc) 20%, var(--bg)); }
  .nota .consejo::-webkit-details-marker { display:none; }
  .nota .consejo b { flex:1; color:var(--acc); }
  .nota .consejo span { font-size:13px; font-weight:700; color:var(--ok); }
  .nota .info { display:grid; place-items:center; width:20px; height:20px; border-radius:50%; border:1.5px solid var(--acc); color:var(--acc); font-style:normal; font-size:12px; font-weight:700; }
  .nota .desglose[open] .info { background:var(--acc); color:var(--sobre-acc); }
  .nota small { display:block; margin-top:14px; font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:1px; }
  .nota .porque { display:grid; grid-template-columns:1fr auto 3.5em; column-gap:10px; font-size:13px; color:var(--dim); padding:3px 0; }
  .nota .porque b { text-align:right; }
  .nota .porque .n { text-align:right; }
  .nota .porque em { grid-column:1 / -1; font-style:normal; font-size:11px; opacity:.75; margin-top:-2px; }
  .nota .porque.media { border-top:1px solid var(--line); margin-top:2px; padding-top:4px; color:var(--txt); }
  .tirador, #editar { display:none; }
  /* La pantalla ancha tiene 2 columnas. --L, --S y --R son el borde izquierdo, el separador y el borde derecho, en px. */
  main:has(.dos) { max-width:none; margin:0; padding:0; }
  .dos .meta { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .hoja.vacia { color:var(--dim); }
  body:has(.dos) #editar { display:flex; align-items:center; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--dim); }
  .acciones { display:flex; gap:6px; }
  .copiar { font-size:12px; display:flex; align-items:center; padding:2px 8px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--dim); }
  .copiar.on { color:var(--acc); border-color:var(--acc); }
  .notas { display:block; width:100%; box-sizing:border-box; margin-top:16px; padding:12px; border:2px solid var(--line); border-radius:12px; background:var(--card); color:var(--txt); font:inherit; font-size:14px; resize:vertical; }
  .notas[hidden] { display:none; }
  .copiar.hecho { color:var(--ok); border-color:var(--ok); }
  body.editando #editar { background:var(--acc); border-color:var(--acc); color:var(--sobre-acc); }
  .tirador::after { content:""; position:absolute; background:var(--line); }
  .tirador::before { content:""; position:absolute; border-radius:7px; border:2px solid var(--line); z-index:1; }
  .tirador:hover::after, .tirador.activo::after { background:var(--acc); }
  .tirador:hover::before, .tirador.activo::before { border-color:var(--acc); }
  body:not(.editando) .tirador { pointer-events:none; }
  body:not(.editando) .tirador::before, body:not(.editando) #tirador-L::after, body:not(.editando) #tirador-R::after { display:none; }
  @media (min-width:900px) {
    body:has(.dos) .tirador { display:block; position:fixed; touch-action:none; z-index:9; }
    main:has(.dos) { padding:16px 0; }
    .dos { display:grid; grid-template-columns:calc(var(--S) - var(--L) - 48px) 1fr; gap:48px; align-items:start; margin-left:var(--L); width:calc(var(--R) - var(--L)); padding:0 24px; }
    .dos .hoja { position:sticky; top:16px; max-height:calc(100vh - 32px); overflow:auto; }
    .tirador { top:0; bottom:0; width:24px; margin-left:-12px; cursor:col-resize; }
    .tirador::after { top:16px; bottom:16px; left:11px; width:2px; }
    .tirador::before { top:50%; left:5px; width:14px; height:40px; margin-top:-20px;
      background:radial-gradient(circle, var(--dim) 1.5px, transparent 2px) center / 6px 8px repeat-y, var(--card); }
  }
  /* La pantalla del móvil: una columna con la línea de arriba, la barra, el cuerpo con su scroll y el pie fijo. */
  main:has(.pant) { max-width:none; margin:0; padding:0; }
  .pant { display:flex; flex-direction:column; height:100dvh; font-size:14px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
  .pant .meta { display:flex; align-items:center; gap:8px; padding:8px 14px 6px; margin:0; font-size:12px; white-space:nowrap; }
  .pant .meta .t { flex:1; overflow:hidden; text-overflow:ellipsis; }
  .barra { height:3px; background:var(--line); }
  .barra i { display:block; height:100%; background:var(--acc); }
  .cuerpo { flex:1; overflow:auto; min-height:0; padding:12px 14px; }
  .pant .q { font-size:16px; line-height:1.4; margin:4px 0 14px; }
  .pant .fila { margin-bottom:8px; border-radius:10px; }
  .pant .fila .texto { padding:11px 12px; font-size:13.5px; }
  .pant .fila .dudo { width:48px; font-size:12px; }
  .pant .fila .icono { padding:0 12px; }
  .fila.resto { opacity:.5; }
  .fila.plegada { display:none; }
  .pant .aviso-respuesta { margin:0 0 10px; }
  .expl { margin:0 0 10px; white-space:pre-line; }
  .pant .notas { margin-top:12px; padding:10px; border-radius:10px; font-size:13px; }
  .chip { width:100%; margin-bottom:8px; padding:6px 10px; border:1px dashed var(--line); border-radius:8px; background:none; color:var(--dim); font-size:12px; }
  .pie { padding:10px 14px calc(10px + env(safe-area-inset-bottom)); border-top:2px solid var(--line); background:var(--bg); }
  .pie:empty { display:none; }
  .pie .blanco { margin-bottom:8px; }
  .pie .ayuda { margin:0; font-size:11.5px; text-align:center; }
  .pie.acciones { display:grid; grid-template-columns:auto 1fr; gap:8px; }
  .pant .grande { margin:0; padding:14px; border-radius:10px; font-size:15px; }
  .fuente-b { display:flex; align-items:center; gap:6px; padding:0 14px; border:2px solid var(--line); border-radius:10px; background:var(--card); font-size:13px; }
  .overlay { position:fixed; inset:0; z-index:10; display:flex; flex-direction:column; background:var(--bg); }
  .ov-cab { display:flex; align-items:center; gap:12px; padding:10px 14px; border-bottom:2px solid var(--line); font-size:12px; }
  .ov-cab .t { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); }
  .ov-cab button { padding:3px 10px; border:1px solid var(--line); border-radius:6px; background:var(--card); }
  .ov-cuerpo { flex:1; overflow:auto; background:#fff; }
  .ov-cuerpo img { display:block; width:100%; }
  .ov-cuerpo img.zoom { width:200%; }
  .ov-pie { padding:6px; border-top:2px solid var(--line); text-align:center; font-size:11px; color:var(--dim); }
</style>
</head>
<body>
<main id="app"><p class="dim">Cargando el banco…</p></main>
<div class="tirador" id="tirador-L"></div><div class="tirador" id="tirador-S"></div><div class="tirador" id="tirador-R"></div>
<button id="editar" title="Ajustar el tamaño de las zonas"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
<script type="module" src="app.js"></script>
</body>
</html>
